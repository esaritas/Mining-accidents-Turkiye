# Tests use synthetic records only; installing dependencies is permitted.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Vocabularies
        run: python -m mining_accidents.cli validate-vocabularies
      - name: Tests
        run: python -m pytest --cov=mining_accidents --cov-report=term
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Dashboard interaction tests
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Published artifact matches the template and saved payload
        run: |
          python -m mining_accidents.cli build-artifact --from-data-js dashboard/data.js
          git diff --exit-code dashboard/artifact.html
      - name: Schema snapshot is in sync
        run: |
          python -m mining_accidents.cli create-db --db-path /tmp/ci.sqlite
          git diff --exit-code database/schema.sql
