# CI for the foundation build. Note: the "no network access for data" rule
# applies to data sources; installing Python dependencies is permitted.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Vocabularies
        run: python -m mining_accidents.cli validate-vocabularies
      - name: Tests
        run: python -m pytest --cov=mining_accidents --cov-report=term
      - name: Schema snapshot is in sync
        run: |
          python -m mining_accidents.cli create-db --db-path /tmp/ci.sqlite
          git diff --exit-code database/schema.sql
