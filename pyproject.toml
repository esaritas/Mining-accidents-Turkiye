[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mining-accidents"
version = "0.1.0"
description = "Evidence-management foundation for a database of fatal mining and quarrying accidents in Türkiye (2010-present). Foundation build: no scraping, no factual data, no dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Turkey Mining Accidents Project" }]
dependencies = [
    "pydantic>=2,<3",
    "pandera>=0.20",
    "pandas>=2.0",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.scripts]
mining-accidents = "mining_accidents.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
