<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mining Accidents in Türkiye: A Public Research Register</title>
<!-- The map is inline SVG projected in the browser: no tiles, no vendor
     library, no network. One renderer, so the local page and the published
     artifact are always identical. -->
<script src="data.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="viz-root">
<main>
  <a class="skip-link" href="#story" data-i18n="skip_link"></a>
  <nav class="anchors" data-aria="aria_sections">
    <a href="#story" data-i18n="nav_story"></a>
    <a href="#map-panel" data-i18n="nav_map"></a>
    <a href="#years" data-i18n="nav_years"></a>
    <a href="#records-panel" data-i18n="nav_records"></a>
    <a href="#sites-panel" data-i18n="nav_sites"></a>
    <a href="#hazards" data-i18n="nav_hazards"></a>
    <a href="#environmental" data-i18n="nav_env"></a>
    <a href="#about" data-i18n="nav_about"></a>
    <a href="#download-panel" data-i18n="nav_download"></a>
    <span class="lang-toggle" role="group" aria-label="Language / Dil">
      <button type="button" data-lang="tr" aria-pressed="false">Türkçe</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </span>
  </nav>
  <header class="page">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1 data-i18n="title"></h1>
    <p class="snapshot-date" id="snapshot-date"></p>
    <p class="lede" data-i18n="lede"></p>
    <p class="note" data-i18n="note"></p>
    <div id="onthisday" hidden></div>
  </header>

  <section id="story" data-aria="aria_story" tabindex="-1">
    <h2 class="sr-only" data-i18n="nav_story"></h2>
    <div class="story-intro" id="story-intro"></div>
    <div class="story-cards" id="story-cards"></div>
  </section>
  <div class="tiles" id="tiles" role="list"></div>
  <section class="evidence-strip" id="evidence-strip" aria-live="polite"></section>
  <details class="evidence-strip" id="evidence-notices" hidden></details>

  <!-- ---- Filters: drive the map, the sites layer and both tables -------- -->
  <div id="filters" role="group" data-aria="aria_filters">
    <label><span data-i18n="f_province"></span>
      <select id="f-province"><option value=""></option></select>
    </label>
    <label><span data-i18n="f_mechanism"></span>
      <select id="f-mechanism"><option value=""></option></select>
    </label>
    <label><span data-i18n="f_from"></span>
      <select id="f-from"></select>
    </label>
    <label><span data-i18n="f_to"></span>
      <select id="f-to"></select>
    </label>
    <label><span data-i18n="f_commodity"></span>
      <select id="f-commodity"><option value=""></option></select>
    </label>
    <button id="f-clear" type="button" data-i18n="f_clear"></button>
    <span id="filter-result" aria-live="polite"></span>
  </div>

  <section class="panel" id="map-panel">
    <h2 data-i18n="map_h"></h2>
    <p class="caption" data-i18n="map_caption"></p>
    <div class="map-controls">
      <div class="layer-toggle" role="group" data-aria="aria_layers">
        <button type="button" data-layer="accidents" aria-pressed="false" data-i18n="layer_acc"></button>
        <button type="button" data-layer="sites" aria-pressed="false" data-i18n="layer_sites"></button>
        <button type="button" data-layer="both" aria-pressed="true" data-i18n="layer_both"></button>
      </div>
      <div class="layer-toggle" role="group" data-aria="aria_view">
        <button type="button" data-view="marks" aria-pressed="true" data-i18n="view_marks"></button>
        <button type="button" data-view="locations" aria-pressed="false" data-i18n="view_locations"></button>
      </div>
      <label class="site-type-control"><span data-i18n="f_site_type"></span><select id="f-site-type"></select></label>
    </div>
    <div class="map-layout"><div class="map-canvas"><div id="map-wrap">
      <div id="map" role="region" data-aria="aria_map"></div>
      <div id="map-tip"></div>
    </div>
    <!-- A count of what is on the map belongs under the map, not in front of it. -->
    <p class="site-coverage" id="site-coverage"></p>
    <div class="maplegend" id="maplegend"></div></div>
    <aside id="map-summary" class="map-summary" aria-live="polite"></aside></div>
    <details class="phone-fold"><summary><span class="sm-h" data-i18n="sm_h"></span></summary>
      <p class="caption" data-i18n="sm_caption"></p>
      <div class="smallmults" id="smallmults" role="group" data-aria="aria_sm"></div>
    </details>
  </section>

  <section class="panel" id="years">
    <h2 data-i18n="chart_h"></h2>
    <p class="caption" id="chart-caption" data-i18n="chart_caption"></p>
    <div class="timeline-chapters" id="timeline-chapters" role="group" data-aria="timeline_chapters"></div>
    <button type="button" id="timeline-reset" data-i18n="timeline_all"></button>
    <div class="layer-toggle" id="series-toggle" role="group" data-aria="series_aria">
      <button type="button" data-series="all" aria-pressed="true" data-i18n="series_all"></button>
      <button type="button" data-series="multi" aria-pressed="false" data-i18n="series_multi"></button>
    </div>
    <p class="timeline-overview" id="timeline-overview" aria-live="polite"></p>
    <div class="legend" aria-hidden="true" id="chart-legend"></div>
    <div id="chart-wrap" class="timeline-scroll">
      <svg id="chart" aria-describedby="chart-caption" role="group"></svg>
      <div id="tooltip"></div>
    </div>
    <section class="year-detail" id="year-detail" aria-live="polite"></section>
    <details class="timeline-fold" id="timeline-fold"><summary id="timeline-fold-summary"></summary>
      <ol class="timeline-events" id="timeline-events"></ol>
      <p class="caption" id="events-caption"></p>
    </details>
    <details class="sector-context"><summary data-i18n="sector_context_title"></summary>
      <p data-i18n="sector_context_note"></p>
      <div class="timeline-scroll"><svg id="sector-chart" role="img" data-aria="lgc_line"></svg></div>
    </details>
    <details class="annual-table"><summary data-i18n="annual_table"></summary><div class="table-scroll" id="annual-table"></div></details>
  </section>

  <section class="panel" id="records-panel">
    <h2 data-i18n="records_h"></h2>
    <p class="caption" data-i18n="records_caption"></p>
    <p class="caption" data-i18n="role_key"></p>
    <div class="table-scroll">
      <table id="records" class="cards"><caption class="sr-only" data-i18n="records_h"></caption>
        <thead><tr id="records-head"></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="panel" id="sites-panel">
    <h2 data-i18n="sites_h"></h2>
    <p class="caption" id="sites-caption" data-i18n="sites_caption"></p>
    <p class="caption" data-i18n="sites_name_note"></p>
    <!-- The breakdown of what the site layer holds belongs with the site table,
         not beside the map, where it doubled the height of the map panel. -->
    <div class="site-summary" id="site-breakdown"></div>
    <details class="phone-fold"><summary><span class="fold-h" data-i18n="sites_fold"></span></summary>
      <div class="table-scroll">
        <table id="sites-table" class="cards"><caption class="sr-only" data-i18n="sites_h"></caption>
          <thead><tr id="sites-head"></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </details>
  </section>

  <section class="panel" id="mech-panel">
    <h2 data-i18n="mech_h"></h2>
    <p class="caption" data-i18n="mech_caption"></p>
    <div id="mechanisms"></div>
  </section>

  <!-- ---- What kind of event is documented, how deadly it was, and where.
       Both axes are counts from this register, so the table describes a
       documented record and not a probability. Built from the public export
       at build time, which is why the filters above do not change it. --- -->
  <section class="panel" id="hazards">
    <h2 data-i18n="hz_h"></h2>
    <p class="caption" data-i18n="hz_caption"></p>
    <div class="table-scroll">
      <table id="hazard-matrix"><caption class="sr-only" data-i18n="hz_h"></caption>
        <thead><tr id="hz-head"></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <details class="phone-fold"><summary><span class="fold-h" data-i18n="hz_prov_h"></span></summary>
      <p class="caption" data-i18n="hz_prov_caption"></p>
      <div class="table-scroll">
        <table id="hazard-provinces"><caption class="sr-only" data-i18n="hz_prov_h"></caption>
          <thead><tr id="hzp-head"></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="caption" id="hz-sites-note"></p>
    </details>
    <p class="caption" data-i18n="hz_method"></p>
  </section>

  <!-- ---- Environmental harm. A separate register with its own identifiers
       (TR-ENV), its own critical fields and its own counts: these records
       document material leaving containment, and they never enter a death
       toll. ------------------------------------------------------------- -->
  <section class="panel" id="environmental">
    <h2 data-i18n="env_h"></h2>
    <p class="caption" data-i18n="env_caption"></p>
    <div id="env-list"></div>
    <p class="caption" data-i18n="env_indirect"></p>
    <p class="caption" data-i18n="env_scope"></p>
  </section>

  <!-- ---- One box for every limit of the work. Notes beside the views above
       explain how to read that view only; everything that is true of the
       whole register is stated here, once. ------------------------------- -->
  <section class="panel" id="about">
    <h2 data-i18n="about_h"></h2>
    <p class="caption" data-i18n="about_intro"></p>
    <div class="about-grid">
      <details><summary data-i18n="ab1_t"></summary><p data-i18n="ab1_d"></p></details>
      <details><summary data-i18n="ab2_t"></summary><p data-i18n="ab2_d"></p></details>
      <details><summary data-i18n="ab10_t"></summary><p data-i18n="ab10_d"></p></details>
      <details><summary data-i18n="ab3_t"></summary><p data-i18n="ab3_d"></p></details>
      <details><summary data-i18n="ab4_t"></summary><p data-i18n="ab4_d"></p></details>
      <details><summary data-i18n="ab5_t"></summary><p data-i18n="ab5_d"></p></details>
      <details><summary data-i18n="ab6_t"></summary><p data-i18n="ab6_d"></p></details>
      <details><summary data-i18n="ab7_t"></summary><p data-i18n="ab7_d"></p></details>
      <details><summary data-i18n="ab9_t"></summary><p data-i18n="ab9_d"></p></details>
      <details><summary data-i18n="ab8_t"></summary><p data-i18n="ab8_d"></p></details>
    </div>
  </section>

  <section class="panel" id="download-panel">
    <h2 data-i18n="dl_h"></h2>
    <p class="caption" data-i18n="dl_caption"></p>
    <div class="layer-toggle" role="group">
      <button type="button" id="dl-records" data-i18n="dl_records"></button>
      <button type="button" id="dl-sites" data-i18n="dl_sites"></button>
      <button type="button" id="dl-json" data-i18n="dl_json"></button>
    </div>
  </section>

  <aside id="detail" class="detail" hidden role="region" data-aria="aria_detail">
    <button type="button" id="detail-close" data-aria="aria_close">&times;</button>
    <div id="detail-body"></div>
  </aside>

  <footer id="foot"></footer>
</main>

<script src="strings.js"></script>
<script src="app.js"></script>
</body>
</html>
