  let LANG = localStorage.getItem("ma_lang")
    || ((navigator.language || "").toLowerCase().startsWith("tr") ? "tr" : "en");
  if (!I18N[LANG]) LANG = "en";
  let fmt = new Intl.NumberFormat(I18N[LANG].locale);
  const t = key => I18N[LANG][key] ?? I18N.en[key] ?? key;
  const tf = (key, params) => Object.entries(params || {}).reduce(
    (s, [k, v]) => s.replaceAll(`{${k}}`, v), String(t(key)));

  const incidents = D.incidents.slice().sort((a, b) =>
    (a.incident_start_datetime || "").localeCompare(b.incident_start_datetime || ""));
  const sites = (D.sites || []).slice().sort((a, b) => a.name.localeCompare(b.name, "tr"));
  const totalDeaths = incidents.reduce((s, i) => s + (i.fatalities_current || 0), 0);
  const mechanismsOf = id => (D.classifications[id] || [])
    .filter(c => c.system === "project_event_mechanism");
  const mechLabel = c => LANG === "tr" ? (c.label_tr || c.label_en) : (c.label_en || c.label_tr);
  const provinceName = code =>
    (D.province_names || {})[code] ||
    (D.province_centroids[code] || {}).label_tr || code || "";
  const yearOf = i => +(i.incident_start_datetime || "").slice(0, 4) || null;
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Dates render at their recorded precision: a date known only to the month must read
  // "April 2005", never "2005-04-01" (audit rule, 2026-07-17).
  function fmtDate(i) {
    const d = i.incident_start_datetime || "";
    if (!d) return "";
    const month = t("months")[+d.slice(5, 7) - 1];
    if (i.date_precision === "month") return `${month} ${d.slice(0, 4)}`;
    if (i.date_precision === "year" || i.date_precision === "approximate") return d.slice(0, 4);
    return `${+d.slice(8, 10)} ${month} ${d.slice(0, 4)}`;
  }
  function sentence(i) {
    const n = i.fatalities_current;
    const who = n === 1 ? t("sent_one") : tf("sent_many", { n: fmt.format(n) });
    const d = i.incident_start_datetime || "";
    const month = t("months")[+d.slice(5, 7) - 1] || "";
    const when = i.date_precision === "exact_date" || i.date_precision === "exact_datetime"
      ? tf("sent_on", { date: `${+d.slice(8, 10)} ${month} ${d.slice(0, 4)}` })
      : i.date_precision === "month"
        ? tf("sent_in_month", { month, year: d.slice(0, 4) })
        : tf("sent_in_year", { year: d.slice(0, 4) });
    const mech = mechanismsOf(i.public_incident_id).map(mechLabel).join(", ");
    return tf("sent_body", { when, who, prov: provinceName(i.province_code) }) +
      (mech ? ` (${mech}).` : ".") +
      (i.casualty_status === "disputed" ? t("sent_disputed") : "");
  }

  // ---- static labels + language plumbing -----------------------------------
  function applyStatic() {
    document.documentElement.lang = LANG;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach(el => {
      el.innerHTML = t(el.dataset.i18n);
    });
    document.querySelector("#f-province option[value='']").textContent = t("f_all_prov");
    document.querySelector("#f-mechanism option[value='']").textContent = t("f_all_mech");
    document.querySelector("#f-commodity option[value='']").textContent = t("f_all_comm");
    document.getElementById("sites-head").innerHTML =
      `<th>${t("sh_site")}</th><th>${t("sh_type")}</th><th>${t("sh_comm")}</th>` +
      `<th>${t("sh_prov")}</th><th>${t("sh_op")}</th><th>${t("sh_country")}</th>` +
      `<th>${t("sh_status")}</th><th>${t("sh_source")}</th>`;
    document.getElementById("records-head").innerHTML =
      `<th>${t("rh_id")}</th><th>${t("rh_date")}</th><th>${t("rh_prov")}</th>` +
      `<th>${t("rh_what")}</th><th class="num">${t("rh_people")}</th>` +
      `<th>${t("rh_mech")}</th><th>${t("rh_sources")}</th>`;
    document.getElementById("maplegend").innerHTML =
      `<span><span class="sw-acc carn-mask"></span> ${t("lg_acc")}</span>` +
      `<span>${t("lg_ramp")}
        <span class="ramp" aria-hidden="true"><span style="background:#f6ddda"></span><span style="background:#eab5b0"></span><span style="background:#d97f77"></span><span style="background:#c24a42"></span><span style="background:#99231d"></span></span>
        1&nbsp;·&nbsp;5&nbsp;·&nbsp;20&nbsp;·&nbsp;100&nbsp;·&nbsp;300+</span>` +
      `<span><span class="sw-site" style="background:var(--c-coal)"></span> ${t("lg_coal")}</span>` +
      `<span><span class="sw-site" style="background:var(--c-metal)"></span> ${t("lg_metal")}</span>` +
      `<span><span class="sw-site" style="background:var(--c-mineral)"></span> ${t("lg_mineral")}</span>` +
      `<span><span class="sw-site" style="background:var(--site)"></span> ${t("lg_other")}</span>`;
    document.getElementById("chart-legend").innerHTML =
      `<span><span class="swatch bar-swatch"></span> ${t("lgc_bars")}</span>` +
      `<span><span class="swatch gap-swatch"></span> ${t("lgc_gap")}</span>` +
      `<span><span class="swatch line-swatch"></span> ${t("lgc_line")}</span>`;
    document.querySelectorAll(".lang-toggle button").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  }

  // ---- On this day ----------------------------------------------------------
  function renderOnThisDay() {
    const today = new Date();
    const todayKey = `${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
    const anniversaries = incidents.filter(i =>
      (i.date_precision === "exact_date" || i.date_precision === "exact_datetime") &&
      (i.incident_start_datetime || "").slice(5, 10) === todayKey);
    const el = document.getElementById("onthisday");
    el.hidden = !anniversaries.length;
    if (anniversaries.length) {
      el.innerHTML = `<b>${t("onthisday")}</b> ` + anniversaries.map(i =>
        `${sentence(i)} (${i.public_incident_id}, ${(i.incident_start_datetime || "").slice(0, 4)})`).join(" ");
    }
  }

  // ---- Story prologue ---------------------------------------------------------
  // Era labels live in I18N.eras (index-aligned) so they localize.
  const ERAS = [{ until: 2000 }, { until: 2010 }, { until: 2020 }, { until: 9999 }];
  const eraOf = i => ERAS.findIndex(e => (yearOf(i) || 0) < e.until);
  const worst = incidents.reduce((w, i) =>
    ((i.fatalities_current || 0) > (w.fatalities_current || 0) ? i : w), incidents[0] || {});
  const firstYear = (incidents[0]?.incident_start_datetime || "1983").slice(0, 4);
  const gap = D.coverage_gap;
  const gapY0 = gap && gap.years.length ? gap.years[0].year : null;
  const gapY1 = gap && gap.years.length ? gap.years[gap.years.length - 1].year : null;

  const marksEl = document.getElementById("marks");
  marksEl.innerHTML = incidents.map((i, idx) => {
    const focal = i === worst ? " focal" : "";
    return `<span class="mark carn-mask off${focal}" data-idx="${idx}" data-era="${eraOf(i)}"></span>`
      .repeat(i.fatalities_current || 0);
  }).join("");
  if (gap && gap.total_gap > 0) {
    document.getElementById("ghost-marks").innerHTML =
      new Array(gap.total_gap).fill('<span class="mark carn-mask ghost"></span>').join("");
  }
  const eraStats = ERAS.map((e, k) => {
    const list = incidents.filter(i => eraOf(i) === k);
    const deaths = list.reduce((s, i) => s + (i.fatalities_current || 0), 0);
    const deadliest = list.reduce((w, i) =>
      ((i.fatalities_current || 0) > (w?.fatalities_current || 0) ? i : w), null);
    return { ...e, list, deaths, deadliest };
  });

  let chapters = [];
  let storyObserver = null;
  function buildStory() {
    const eraCard = k => {
      const s = eraStats[k];
      if (!s.list.length) return "";
      const head = `<p class="k">${tf("era_head", { era: t("eras")[k], d: fmt.format(s.deaths), n: s.list.length })}</p>`;
      const worstLine = s.deadliest && s.deadliest !== worst
        ? `<p class="quiet" lang="tr">${s.deadliest.canonical_title_tr}</p><p class="quiet">${sentence(s.deadliest)}</p>` : "";
      return head + worstLine;
    };
    chapters = [
      { html: `<p class="k">${t("ch_open_k")}</p>` +
              `<p class="quiet">${tf("ch_open_q", { y: firstYear, d: fmt.format(totalDeaths), n: fmt.format(incidents.length) })}</p>` +
              `<p class="scrollhint">${t("scroll")}</p>`,
        cls: "first", state: { upTo: -1 } },
      { html: eraCard(0), state: { upTo: 0, label: t("eras")[0], count: eraStats[0].deaths } },
      { html: eraCard(1), state: { upTo: 1, label: t("eras")[1], count: eraStats[1].deaths } },
      { html: eraCard(2), state: { upTo: 2, label: t("eras")[2], count: eraStats[2].deaths } },
      worst && worst.public_incident_id ? {
        html: `<p class="k" lang="tr">${worst.canonical_title_tr}</p>` +
              `<p>${sentence(worst)}</p>` +
              `<p class="quiet">${t("worst_q")}</p>` +
              `<p class="src">${tf("worst_src", { id: worst.public_incident_id })}</p>`,
        cls: "tall", state: { upTo: 2, focus: true, label: fmtDate(worst), count: worst.fatalities_current } } : null,
      { html: eraCard(3), state: { upTo: 3, label: t("eras")[3], count: eraStats[3].deaths } },
      gap && gap.total_gap > 0 ? {
        html: `<p class="k">${t("gap_k")}</p>` +
              `<p>${tf("gap_p", { y0: gapY0, y1: gapY1, n: fmt.format(gap.total_gap) })}</p>` +
              `<p class="src">${t("gap_caveat")}</p>`,
        cls: "tall", state: { upTo: 3, ghosts: true, label: tf("range", { a: gapY0, b: gapY1 }), count: gap.total_gap } } : null,
      { html: `<p class="k">${t("close_k")}</p>` +
              `<p class="quiet">${t("close_q")}</p>`,
        state: { upTo: 3, ghosts: gap && gap.total_gap > 0, label: t("the_record"), count: totalDeaths } },
    ].filter(Boolean);

    document.getElementById("chapters").innerHTML = chapters.map((c, k) =>
      `<article class="chapter ${c.cls || ""}" data-ch="${k}"><div class="card">${c.html}</div></article>`
    ).join("");

    if (storyObserver) storyObserver.disconnect();
    if (reducedMotion) {
      applyState({ upTo: 3, ghosts: gap && gap.total_gap > 0, label: t("the_record"),
                   count: totalDeaths });
    } else {
      applyState(chapters[0].state);
      storyObserver = new IntersectionObserver(entries => {
        for (const entry of entries) {
          if (entry.isIntersecting) applyState(chapters[+entry.target.dataset.ch].state);
        }
      }, { threshold: 0.45 });
      document.querySelectorAll(".chapter").forEach(ch => storyObserver.observe(ch));
    }
  }

  const stage = document.getElementById("stage");
  const eraLabel = document.getElementById("era-label");
  const eraCount = document.getElementById("era-count");
  const stageNote = document.getElementById("stage-note");
  const ghostField = document.getElementById("ghost-marks");
  const allMarks = marksEl.querySelectorAll(".mark");

  function applyState(st) {
    allMarks.forEach(m => m.classList.toggle("off", +m.dataset.era > st.upTo));
    stage.classList.toggle("focus", !!st.focus);
    ghostField.classList.toggle("show", !!st.ghosts);
    eraLabel.textContent = st.label || "";
    eraCount.innerHTML = st.count != null
      ? (st.ghosts ? tf("stage_ghosts", { n: fmt.format(st.count) })
                   : tf("stage_people", { n: fmt.format(st.count) }))
      : "";
    stageNote.textContent = st.upTo >= 0 ? t("stage_note") : "";
  }

  // ---- Tiles ------------------------------------------------------------------
  function renderTiles() {
    const tiles = [
      { v: totalDeaths, l: t("tile1l"), s: t("tile1s") },
      { v: incidents.length, l: t("tile2l"), s: t("tile2s") },
      { v: gap ? gap.total_gap : 0, l: t("tile3l"),
        s: gap && gap.years.length ? tf("tile3s", { y0: gapY0, y1: gapY1 }) : "" },
      { v: sites.length, l: t("tile4l"), s: t("tile4s") },
      { v: D.pipeline.records_in_review + D.pipeline.claims_awaiting_review,
        l: t("tile5l"), s: t("tile5s") },
    ];
    document.getElementById("tiles").innerHTML = tiles.map(x =>
      `<div class="tile" role="listitem"><div class="value">${fmt.format(x.v)}</div>` +
      `<div class="label">${x.l}</div><div class="sub">${x.s}</div></div>`).join("");
  }

  // ---- Filters ------------------------------------------------------------------
  const CONTEXT_TYPES = new Set(["archaeological_quarry", "mining_field",
    "operating_directorate", "regional_group", "deposit", "proposed_project"]);
  const isOperational = s => !CONTEXT_TYPES.has(s.type);
  const typeLabel = s => t("types")[s.type] || s.type || "";
  const statusLabel = s => t("statuses")[s.status] || t("pill_not_stated");
  // Commodity groups (validated palette; gray = not stated in source).
  const COMM_GROUPS = {
    coal: "coal", lignite: "coal",
    chromium: "metal", iron: "metal", copper: "metal", gold: "metal",
    silver: "metal", zinc: "metal", lead: "metal",
    boron: "mineral", phosphate: "mineral", marble: "mineral",
  };
  const GROUP_HEX = { coal: "#4a5fc1", metal: "#a08000", mineral: "#0f8a5f", other: "#8a8f96" };
  const groupOf = site => COMM_GROUPS[site.commodity_code] || "other";
  // Unified display labels per language; the source's own wording stays in the
  // tooltip (labels arrive in mixed languages: kömür / coal / altın).
  const commodityText = site => site.commodity_code
    ? (t("comms")[site.commodity_code] ||
       (site.commodity_label ? tf("comm_other_label", { l: site.commodity_label }) : t("comm_other")))
    : null;
  const state = { province: "", mechanism: "", from: null, to: null, commodity: "", layer: "both" };

  const provSel = document.getElementById("f-province");
  const mechSel = document.getElementById("f-mechanism");
  const fromSel = document.getElementById("f-from");
  const toSel = document.getElementById("f-to");
  const commSel = document.getElementById("f-commodity");

  const yearsAll = incidents.map(yearOf).filter(Boolean);
  const minY = Math.min(...yearsAll), maxY = Math.max(...yearsAll);
  state.from = minY; state.to = maxY;

  function fillSelects() {
    const provCodes = [...new Set([
      ...incidents.map(i => i.province_code).filter(Boolean),
      ...sites.map(s => s.province_code).filter(Boolean),
    ])].sort((a, b) => provinceName(a).localeCompare(provinceName(b), "tr"));
    provSel.innerHTML = `<option value="">${t("f_all_prov")}</option>` + provCodes.map(c =>
      `<option value="${c}">${provinceName(c)}</option>`).join("");
    provSel.value = state.province;

    const mechs = new Map();
    for (const i of incidents) for (const c of mechanismsOf(i.public_incident_id)) {
      mechs.set(c.code, mechLabel(c));
    }
    mechSel.innerHTML = `<option value="">${t("f_all_mech")}</option>` +
      [...mechs.entries()].sort((a, b) => a[1].localeCompare(b[1]))
      .map(([code, label]) => `<option value="${code}">${label}</option>`).join("");
    mechSel.value = state.mechanism;

    let yearOpts = "";
    for (let y = minY; y <= maxY; y++) yearOpts += `<option value="${y}">${y}</option>`;
    fromSel.innerHTML = yearOpts; toSel.innerHTML = yearOpts;
    fromSel.value = String(state.from); toSel.value = String(state.to);

    const comms = new Map();
    for (const s of sites) {
      if (s.commodity_code) comms.set(s.commodity_code, commodityText(s));
    }
    commSel.innerHTML = `<option value="">${t("f_all_comm")}</option>` +
      [...comms.entries()].sort((a, b) => String(a[1]).localeCompare(String(b[1])))
      .map(([code, label]) => `<option value="${code}">${label}</option>`).join("");
    commSel.value = state.commodity;
  }

  const incidentMatches = i =>
    (!state.province || i.province_code === state.province) &&
    (!state.mechanism || mechanismsOf(i.public_incident_id).some(c => c.code === state.mechanism)) &&
    (yearOf(i) == null || (yearOf(i) >= state.from && yearOf(i) <= state.to));
  const siteMatches = s =>
    (!state.province || s.province_code === state.province) &&
    (!state.commodity || s.commodity_code === state.commodity);

  function applyFilters() {
    const fi = incidents.filter(incidentMatches);
    const fs = sites.filter(siteMatches);
    renderRecords(fi);
    renderSites(fs);
    renderMap(fi, fs);
    const people = fi.reduce((s, i) => s + (i.fatalities_current || 0), 0);
    document.getElementById("filter-result").innerHTML = tf("result",
      { r: fmt.format(fi.length), p: fmt.format(people), s: fmt.format(fs.length) });
  }

  provSel.addEventListener("change", () => { state.province = provSel.value; applyFilters(); });
  mechSel.addEventListener("change", () => { state.mechanism = mechSel.value; applyFilters(); });
  fromSel.addEventListener("change", () => {
    state.from = +fromSel.value;
    if (state.from > state.to) { state.to = state.from; toSel.value = fromSel.value; }
    applyFilters();
  });
  toSel.addEventListener("change", () => {
    state.to = +toSel.value;
    if (state.to < state.from) { state.from = state.to; fromSel.value = toSel.value; }
    applyFilters();
  });
  commSel.addEventListener("change", () => { state.commodity = commSel.value; applyFilters(); });
  document.getElementById("f-clear").addEventListener("click", () => {
    state.province = ""; state.mechanism = ""; state.commodity = "";
    state.from = minY; state.to = maxY;
    provSel.value = ""; mechSel.value = ""; commSel.value = "";
    fromSel.value = String(minY); toSel.value = String(maxY);
    applyFilters();
  });
  document.querySelectorAll(".layer-toggle button[data-layer]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.layer = btn.dataset.layer;
      document.querySelectorAll(".layer-toggle button[data-layer]").forEach(b =>
        b.setAttribute("aria-pressed", String(b === btn)));
      applyFilters();
    });
  });

  // ---- Language switch --------------------------------------------------------
  document.querySelectorAll(".lang-toggle button").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.dataset.lang === LANG) return;
      LANG = btn.dataset.lang;
      localStorage.setItem("ma_lang", LANG);
      fmt = new Intl.NumberFormat(I18N[LANG].locale);
      renderAll();
    });
  });

  // ---- Map ----------------------------------------------------------------
  function siteTip(s) {
    const orgLines = (s.organizations || []).map(o =>
      `${o.role === "owner" ? t("owner") : t("operator")}: ${o.name}` +
      (o.country_label ? ` (${o.country_label})` : "") +
      ` <span class="t-meta">[${o.assertion_status}]</span>`);
    return `<div class="t-title" lang="tr">${s.name}</div>` +
      `<div>${typeLabel(s)}` +
      (commodityText(s) ? ` · ${commodityText(s)}` : "") +
      (s.province_code ? ` · ${provinceName(s.province_code)}` : "") + `</div>` +
      (orgLines.length ? `<div>${orgLines.join("<br>")}</div>` : "") +
      `<div class="t-meta">${t("status_label")}: ${statusLabel(s)} · ${t("loc_approx")}</div>` +
      `<div class="t-meta">${t("partial_note")}</div>`;
  }

  // Sequential red scale, fixed breaks so shades stay comparable while
  // filtering: 0 · 1-4 · 5-19 · 20-99 · 100-299 · 300+ people.
  const RAMP = ["#f6ddda", "#eab5b0", "#d97f77", "#c24a42", "#99231d"];
  const rampColor = deaths => deaths <= 0 ? null
    : deaths < 5 ? RAMP[0] : deaths < 20 ? RAMP[1] : deaths < 100 ? RAMP[2]
    : deaths < 300 ? RAMP[3] : RAMP[4];
  function provinceStats(fi, fs) {
    const stats = new Map();
    const get = code => {
      if (!stats.has(code)) stats.set(code, { deaths: 0, records: 0, unlocated: [],
                                              sites: 0, sitesUnlocated: 0 });
      return stats.get(code);
    };
    for (const i of fi) {
      if (!i.province_code) continue;
      const e = get(i.province_code);
      e.deaths += i.fatalities_current || 0; e.records += 1;
      if (i.latitude == null) e.unlocated.push(i);
    }
    for (const st of fs) {
      if (!st.province_code) continue;
      const e = get(st.province_code);
      e.sites += 1;
      if (st.latitude == null) e.sitesUnlocated += 1;
    }
    return stats;
  }
  function provinceTipHtml(code, e) {
    const rows = e.unlocated.slice(0, 8).map(i =>
      `${i.public_incident_id} · ${fmtDate(i)} · ${fmt.format(i.fatalities_current)}`
    ).join("<br>");
    return `<div class="t-title">${provinceName(code)}</div>` +
      (e.records
        ? `<div>${tf("prov_lost", { d: fmt.format(e.deaths), n: e.records })}</div>`
        : `<div class="t-meta">${t("prov_none")}</div>`) +
      (e.unlocated.length ? `<div class="t-meta">${tf("prov_unlocated", { n: e.unlocated.length })}<br>${rows}${e.unlocated.length > 8 ? "<br>…" : ""}</div>` : "") +
      (e.sites ? `<div class="t-meta">${tf("prov_sites", { n: e.sites })}` +
        (e.sitesUnlocated ? tf("prov_sites_unloc", { n: e.sitesUnlocated }) : "") +
        `</div>` : "");
  }

  let leafletMap = null, leafletAccidents = null, leafletSites = null, leafletProvinces = null;
  let mapMode = null;
  function renderMap(fi, fs) {
    const wantLeaflet = !!window.L;
    try {
      if (wantLeaflet) { renderLeaflet(fi, fs); mapMode = "leaflet"; return; }
    } catch (err) { /* fall through to SVG */ }
    try { renderSvgMap(fi, fs); mapMode = "svg"; } catch (err2) {
      console.error("svg map failed:", err2);
      document.getElementById("map").innerHTML =
        `<p style="padding:16px;color:var(--ink-2)">${t("map_failed")}</p>`;
    }
  }

  function renderSvgMap(fi, fs) {
    const V = D.map_vector;
    const el = document.getElementById("map");
    const byId = new Map(incidents.map(i => [i.public_incident_id, i]));
    const okIds = new Set(fi.map(i => i.public_incident_id));
    const okRefs = new Set(fs.filter(isOperational).map(s => s.ref));
    const showAcc = state.layer !== "sites", showSites = state.layer !== "accidents";

    const stats = provinceStats(fi, fs);
    const provParts = (V.provinces || []).map(p => {
      const e = stats.get(p.code);
      const fill = showAcc && e ? rampColor(e.deaths) : null;
      const cls = "tr-prov" + (e ? " has-data" : "");
      return `<path class="${cls}" data-prov="${p.code}" ${fill ? `style="fill:${fill}"` : ""} d="${p.d}"></path>`;
    }).join("");
    // One carnation per located record, scaled by the number of people
    // (capped so the largest losses stay flowers, not blots; the popup and
    // table carry the exact numbers).
    const aParts = (V.markers || []).map(m => {
      if (!showAcc || !okIds.has(m.id)) return "";
      const s = Math.min(Math.max(Math.round((m.r / 12) * 100) / 100, 0.65), 1.9);
      return `<use href="#carnation-fig" class="svg-marker" data-id="${m.id}" ` +
        `transform="translate(${m.x},${m.y}) scale(${s})"></use>`;
    }).join("");
    const bySiteRefAll = new Map(sites.map(st => [st.ref, st]));
    const seenXY = new Map();
    const sParts = (V.siteMarks || []).map(m => {
      if (!showSites || !okRefs.has(m.ref)) return "";
      const key = `${m.x},${m.y}`;
      const bump = seenXY.get(key) || 0;
      seenXY.set(key, bump + 1);
      const x = m.x + bump * 7;  // nudge identical points apart (both stay visible)
      const fill = GROUP_HEX[groupOf(bySiteRefAll.get(m.ref) || {})];
      return `<path class="svg-site" fill="${fill}" data-ref="${m.ref}" d="M${x},${m.y - 4.4} L${x + 4.4},${m.y} L${x},${m.y + 4.4} L${x - 4.4},${m.y} Z"></path>`;
    }).join("");
    el.innerHTML = `<svg viewBox="-8 -8 ${V.W + 16} ${V.H + 16}" role="img" ` +
      `aria-label="Türkiye">` +
      `<defs><g id="carnation-fig" transform="translate(-12,-9)">` +
      `<path d="M12 1.5 L14.4 5.2 L17.8 3.4 L18.4 7.3 L22.3 8 L20.5 11.6 C18.8 15 15.6 16.8 12 16.8 C8.4 16.8 5.2 15 3.5 11.6 L1.7 8 L5.6 7.3 L6.2 3.4 L9.6 5.2 Z M9 16.3 L15 16.3 L13.3 22.3 L10.7 22.3 Z M11.2 21.8 L12.8 21.8 L12.8 34.5 L11.2 34.5 Z M12.8 27.5 C15.4 26.8 17 24.8 17.5 22.6 C14.9 23.3 13.3 25.3 12.8 27.5 Z"></path>` +
      `</g></defs>` +
      provParts + sParts + aParts + `</svg>`;

    const bySiteRef = new Map(sites.map(s => [s.ref, s]));
    const tip = document.getElementById("map-tip");
    const wrapEl = document.getElementById("map-wrap");
    const svgEl = el.querySelector("svg");
    svgEl.addEventListener("mousemove", ev => {
      const hit = ev.target.closest(".svg-marker, .svg-site, .tr-prov.has-data");
      svgEl.querySelectorAll(".is-hover").forEach(n => n.classList.remove("is-hover"));
      if (!hit) { tip.style.display = "none"; return; }
      hit.classList.add("is-hover");
      if (hit.classList.contains("svg-site")) {
        tip.innerHTML = siteTip(bySiteRef.get(hit.dataset.ref));
      } else if (hit.classList.contains("tr-prov")) {
        tip.innerHTML = provinceTipHtml(hit.dataset.prov, stats.get(hit.dataset.prov));
      } else {
        const i = byId.get(hit.dataset.id);
        tip.innerHTML = `<div class="t-title" lang="tr">${i.canonical_title_tr}</div>` +
          `<div>${sentence(i)}</div>` +
          `<div class="t-meta">${i.public_incident_id} · ${t("loc_approx")}</div>`;
      }
      tip.style.display = "block";
      const box = wrapEl.getBoundingClientRect();
      let tx = ev.clientX - box.left + 14, ty = ev.clientY - box.top + 14;
      if (tx + tip.offsetWidth > box.width) tx -= tip.offsetWidth + 26;
      tip.style.left = tx + "px"; tip.style.top = ty + "px";
    });
    svgEl.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  }

  function renderLeaflet(fi, fs) {
    if (!leafletMap) {
      document.getElementById("map").style.height = "440px";
      leafletMap = L.map("map", { scrollWheelZoom: false });
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 12,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }).addTo(leafletMap);
    }
    if (leafletAccidents) leafletMap.removeLayer(leafletAccidents);
    if (leafletSites) leafletMap.removeLayer(leafletSites);
    if (leafletProvinces) leafletMap.removeLayer(leafletProvinces);

    const showAcc = state.layer !== "sites", showSites = state.layer !== "accidents";
    const accMarkers = [];
    const carnationSvg = (h, fill) =>
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="${(h * 24) / 36}" height="${h}">` +
      `<path fill="${fill}" stroke="#fbfbfc" stroke-width="1.2" d="M12 1.5 L14.4 5.2 L17.8 3.4 L18.4 7.3 L22.3 8 L20.5 11.6 C18.8 15 15.6 16.8 12 16.8 C8.4 16.8 5.2 15 3.5 11.6 L1.7 8 L5.6 7.3 L6.2 3.4 L9.6 5.2 Z M9 16.3 L15 16.3 L13.3 22.3 L10.7 22.3 Z M11.2 21.8 L12.8 21.8 L12.8 34.5 L11.2 34.5 Z M12.8 27.5 C15.4 26.8 17 24.8 17.5 22.6 C14.9 23.3 13.3 25.3 12.8 27.5 Z"></path></svg>`;
    if (showAcc) {
      for (const i of fi.filter(i => i.latitude != null && i.longitude != null)) {
        const h = Math.min(Math.round(16 + Math.sqrt(i.fatalities_current || 1) * 4.4), 54);
        const w = Math.round((h * 24) / 36);
        const m = L.marker([i.latitude, i.longitude], {
          icon: L.divIcon({ className: "carnation-marker", html: carnationSvg(h, "#c22f2f"),
                            iconSize: [w, h], iconAnchor: [w / 2, h / 2] }),
        });
        const cites = (D.citations[i.public_incident_id] || [])
          .map(c => `<a href="${c.url}" target="_blank" rel="noopener">${c.organization}: ${c.title}</a>`)
          .join("<br>");
        m.bindPopup(
          `<b lang="tr">${i.canonical_title_tr}</b><br>${sentence(i)}<br>` +
          `<span class="meta">${i.public_incident_id} · ${t("loc_approx")}</span>` +
          (cites ? `<hr style="border:none;border-top:1px solid #ddd">${cites}` : ""));
        accMarkers.push(m);
      }
    }
    // Province choropleth: every record shades its province, located or not.
    const stats = provinceStats(fi, fs);
    const provPolys = [];
    if (showAcc) {
      for (const prov of (D.provinces_geo || [])) {
        const e = stats.get(prov.code);
        const fill = e ? rampColor(e.deaths) : null;
        const poly = L.polygon(prov.rings, {
          color: "#9aa0a6", weight: 0.6,
          fillColor: fill || "#e8eaed", fillOpacity: fill ? 0.55 : 0.15,
          interactive: !!e,
        });
        if (e) poly.bindPopup(provinceTipHtml(prov.code, e));
        provPolys.push(poly);
      }
    }
    const siteMarkers = [];
    if (showSites) {
      for (const s of fs.filter(s => isOperational(s) && s.latitude != null && s.longitude != null)) {
        const m = L.marker([s.latitude, s.longitude], {
          icon: L.divIcon({ className: "site-diamond",
                            html: `<div style="background:${GROUP_HEX[groupOf(s)]}"></div>`,
                            iconSize: [9, 9], iconAnchor: [4.5, 4.5] }),
          keyboard: false,
        });
        m.bindPopup(siteTip(s) +
          (s.source_url ? `<br><a href="${s.source_url}" target="_blank" rel="noopener">${t("wikidata_src")}</a>` : ""));
        siteMarkers.push(m);
      }
    }
    leafletProvinces = L.featureGroup(provPolys).addTo(leafletMap);
    leafletSites = L.featureGroup(siteMarkers).addTo(leafletMap);
    leafletAccidents = L.featureGroup(accMarkers).addTo(leafletMap);
    const all = L.featureGroup([...accMarkers, ...siteMarkers, ...provPolys]);
    if (accMarkers.length + siteMarkers.length + provPolys.length) {
      leafletMap.fitBounds(all.getBounds().pad(0.1));
    } else { leafletMap.setView([39.0, 35.2], 6); }
  }

  // ---- Chart (always the full register) --------------------------------------
  const byYear = new Map();
  for (const i of incidents) {
    const y = yearOf(i);
    if (!y) continue;
    const e = byYear.get(y) || { deaths: 0, incidents: 0 };
    e.deaths += i.fatalities_current || 0; e.incidents += 1;
    byYear.set(y, e);
  }
  const isigByYear = new Map(D.aggregates.map(a => [a.year, a.deaths]));
  const chartYears = [];
  const cy0 = Math.min(...byYear.keys(), 2010);
  const cy1 = Math.max(new Date().getFullYear(), ...byYear.keys());
  for (let y = cy0; y <= cy1; y++) chartYears.push(y);
  const maxDeaths = Math.max(
    ...chartYears.map(y => (byYear.get(y) || { deaths: 0 }).deaths),
    ...isigByYear.values(), 1);

  function renderChart() {
    const years = chartYears;
    const W = 1000, H = 320, M = { t: 34, r: 12, b: 30, l: 44 };
    const iw = W - M.l - M.r, ih = H - M.t - M.b;
    const bw = Math.min(40, iw / years.length - 2);
    const x = idx => M.l + (iw / years.length) * idx + ((iw / years.length) - bw) / 2;
    const yScale = v => M.t + ih * (1 - v / maxDeaths);
    const svg = document.getElementById("chart");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

    let parts = [];
    const gridSteps = 4;
    for (let g = 1; g <= gridSteps; g++) {
      const gy = M.t + (ih / gridSteps) * (gridSteps - g);
      const gv = Math.round((maxDeaths / gridSteps) * g);
      parts.push(`<line class="gridline" x1="${M.l}" x2="${W - M.r}" y1="${gy}" y2="${gy}"></line>`);
      parts.push(`<text class="ticklabel" x="${M.l - 8}" y="${gy + 4}" text-anchor="end">${gv}</text>`);
    }
    parts.push(`<line class="axisline" x1="${M.l}" x2="${W - M.r}" y1="${M.t + ih}" y2="${M.t + ih}"></line>`);
    parts.push(`<text class="ticklabel" x="${M.l - 8}" y="${M.t - 10}" text-anchor="end">${t("people_unit")}</text>`);

    // Undercount columns behind everything: register-recorded top -> İSİG total.
    years.forEach((year, idx) => {
      const isig = isigByYear.get(year);
      if (isig == null) return;
      const rec = Math.min((byYear.get(year) || { deaths: 0 }).deaths, isig);
      const top = yScale(isig), bottom = yScale(rec);
      if (bottom - top > 1) {
        parts.push(`<rect class="gap-col" x="${x(idx)}" y="${top}" width="${bw}" height="${bottom - top}"></rect>`);
      }
    });

    const labelParts = [];
    const peak = years.reduce((best, y) =>
      ((byYear.get(y) || { deaths: 0 }).deaths > (byYear.get(best) || { deaths: 0 }).deaths ? y : best), cy0);
    years.forEach((year, idx) => {
      const e = byYear.get(year) || { deaths: 0, incidents: 0 };
      const bx = x(idx), by = yScale(e.deaths), bh = M.t + ih - by;
      if (e.deaths > 0) {
        const r = Math.min(4, bw / 2, bh);
        parts.push(`<path class="bar" data-year="${year}" d="M${bx},${M.t + ih} v${-(bh - r)} q0,${-r} ${r},${-r} h${bw - 2 * r} q${r},0 ${r},${r} v${bh - r} z"></path>`);
        if (year === peak && bh > 26) {
          labelParts.push(`<text class="direct-label inside" x="${bx + bw / 2}" y="${by + 15}" text-anchor="middle">${fmt.format(e.deaths)}</text>`);
        }
      }
      const every = years.length > 24 ? 5 : (years.length > 12 ? 2 : 1);
      if (year % every === 0 || years.length <= 12) {
        parts.push(`<text class="ticklabel" x="${bx + bw / 2}" y="${M.t + ih + 18}" text-anchor="middle">${year}</text>`);
      }
      parts.push(`<rect class="hit" data-year="${year}" x="${M.l + (iw / years.length) * idx}" y="${M.t}" width="${iw / years.length}" height="${ih}" fill="transparent"></rect>`);
    });

    // İSİG sector-wide context series.
    const contextPts = years
      .map((year, idx) => ({ year, idx, v: isigByYear.get(year) }))
      .filter(p => p.v != null);
    if (contextPts.length) {
      const pt = p => `${x(p.idx) + bw / 2},${yScale(p.v)}`;
      parts.push(`<polyline class="context-line" points="${contextPts.map(pt).join(" ")}"></polyline>`);
      for (const p of contextPts) {
        parts.push(`<circle class="context-dot" cx="${x(p.idx) + bw / 2}" cy="${yScale(p.v)}" r="3"></circle>`);
      }
    }

    // Policy/treaty markers (descriptive; disasters are visible as bars already).
    const evLabel = e => LANG === "tr" ? (e.label_tr || e.label_en) : (e.label_en || e.label_tr);
    const lawEvents = (D.policy_events || []).filter(e => e.kind !== "disaster");
    lawEvents.forEach((e, n) => {
      const year = +e.date.slice(0, 4);
      const idx = years.indexOf(year);
      if (idx < 0) return;
      const ex = x(idx) + bw / 2;
      parts.push(`<line class="event-line" x1="${ex}" x2="${ex}" y1="${M.t - 4}" y2="${M.t + ih}"></line>`);
      const anchor = idx > years.length * 0.75 ? "end" : "start";
      labelParts.push(`<text class="event-label" x="${ex + (anchor === "start" ? 4 : -4)}" y="${M.t - 8 + (n % 2) * 12}" text-anchor="${anchor}">${evLabel(e).split("(")[0].trim()}</text>`);
    });

    parts.push(...labelParts);
    svg.innerHTML = parts.join("");
    document.getElementById("events-caption").innerHTML = t("marked_events") + " " +
      (D.policy_events || []).map(e =>
        `<a href="${e.source_url}" rel="noopener" target="_blank">${e.date.slice(0, 4)} ${evLabel(e)}</a>`
      ).join(" · ");

    const tooltip = document.getElementById("tooltip");
    const wrap = document.getElementById("chart-wrap");
    svg.onmousemove = ev => {
      const hit = ev.target.closest(".hit");
      svg.querySelectorAll(".bar.is-hover").forEach(b => b.classList.remove("is-hover"));
      if (!hit) { tooltip.style.display = "none"; return; }
      const year = +hit.dataset.year;
      const bar = svg.querySelector(`.bar[data-year="${year}"]`);
      if (bar) bar.classList.add("is-hover");
      const e = byYear.get(year) || { deaths: 0, incidents: 0 };
      const isig = isigByYear.get(year);
      tooltip.innerHTML = `<div class="t-title">${year}</div>` +
        `<div class="t-row"><span>${t("tt_people")}</span><span class="v">${fmt.format(e.deaths)}</span></div>` +
        `<div class="t-row"><span>${t("tt_records")}</span><span class="v">${fmt.format(e.incidents)}</span></div>` +
        (isig != null ? `<div class="t-row"><span>${t("tt_isig")}</span><span class="v">${fmt.format(isig)}</span></div>` : "") +
        (isig != null ? `<div class="t-row"><span>${t("tt_never")}</span><span class="v">${fmt.format(Math.max(isig - Math.min(e.deaths, isig), 0))}</span></div>` : "") +
        (e.incidents === 0 ? `<div class="t-row"><span>${t("tt_none")}</span></div>` : "");
      tooltip.style.display = "block";
      const box = wrap.getBoundingClientRect();
      let tx = ev.clientX - box.left + 14, ty = ev.clientY - box.top - 10;
      if (tx + tooltip.offsetWidth > box.width) tx -= tooltip.offsetWidth + 26;
      tooltip.style.left = tx + "px"; tooltip.style.top = ty + "px";
    };
    svg.onmouseleave = () => {
      tooltip.style.display = "none";
      svg.querySelectorAll(".bar.is-hover").forEach(b => b.classList.remove("is-hover"));
    };
  }

  // ---- Rate context -----------------------------------------------------------
  function renderRates() {
    const rateRows = [];
    const byCountry = new Map();
    for (const r of (D.rate_context || [])) {
      const key = `${r.country}|${r.year ?? ""}`;
      byCountry.set(key, [...(byCountry.get(key) || []), r]);
    }
    for (const [key, rows] of byCountry) {
      const [country, year] = key.split("|");
      const values = rows.map(r => r.value).sort((a, b) => a - b);
      rateRows.push({
        label: t("countries")[country] || country,
        year: year || t("year_unspec"),
        low: values[0], high: values[values.length - 1],
      });
    }
    rateRows.sort((a, b) => b.high - a.high);
    const rateMax = Math.max(...rateRows.map(r => r.high), 1);
    document.getElementById("rates").innerHTML = rateRows.map(r => {
      const text = r.low === r.high ? fmt.format(r.high)
        : tf("range", { a: fmt.format(r.low), b: fmt.format(r.high) });
      const cls = r.label === "Türkiye" ? "" : " other";
      return `<div class="rrow"><div class="rlabel">${r.label} <span class="ry">${r.year}</span></div>` +
        `<div><div class="rfill${cls}" style="width:${(r.high / rateMax) * 100}%"></div></div>` +
        `<div class="rcount">${text}</div></div>`;
    }).join("");
  }

  // ---- Mechanisms --------------------------------------------------------------
  function renderMechanisms() {
    const mechCounts = new Map();
    for (const i of incidents) {
      for (const c of mechanismsOf(i.public_incident_id)) {
        const key = `${c.label_en}|${c.label_tr}`;
        mechCounts.set(key, (mechCounts.get(key) || 0) + 1);
      }
    }
    const mechRows = [...mechCounts.entries()].sort((a, b) => b[1] - a[1]);
    const mechMax = Math.max(...mechRows.map(r => r[1]), 1);
    document.getElementById("mechanisms").innerHTML = mechRows.map(([key, n]) => {
      const [en, tr] = key.split("|");
      const main = LANG === "tr" ? tr : en, second = LANG === "tr" ? en : tr;
      return `<div class="mrow">` +
        `<div class="mlabel">${main} <span class="tr">${second}</span></div>` +
        `<div><div class="mfill" style="width:${(n / mechMax) * 100}%"></div></div>` +
        `<div class="mcount">${n}</div></div>`;
    }).join("") || `<p class="caption">${t("mech_none")}</p>`;
  }

  // ---- Sites table -----------------------------------------------------------
  function renderSites(fs) {
    document.querySelector("#sites-table tbody").innerHTML = fs.map(s => {
      const orgs = (s.organizations || []);
      const orgNames = orgs.map(o =>
        `<span lang="tr">${o.name}</span> <span class="pill">${o.role === "owner" ? t("owner") : t("operator")} · ${o.assertion_status}</span>`).join("<br>") ||
        `<span class="pill">${t("pill_not_stated_src")}</span>`;
      const countries = [...new Set(orgs.map(o => o.country_label).filter(Boolean))].join(", ") ||
        `<span class="pill">${t("pill_not_stated")}</span>`;
      return `<tr>
        <td lang="tr">${s.name}</td>
        <td>${typeLabel(s)}</td>
        <td title="${s.commodity_label || ""}"><span class="comm-chip" style="background:${GROUP_HEX[groupOf(s)]}"></span>${commodityText(s) || `<span class="pill">${t("pill_not_stated")}</span>`}</td>
        <td>${s.province_code ? provinceName(s.province_code) : `<span class="pill">${t("pill_not_stated")}</span>`}</td>
        <td>${orgNames}</td>
        <td>${countries}</td>
        <td>${statusLabel(s)}</td>
        <td>${s.source_url ? `<a href="${s.source_url}" target="_blank" rel="noopener">Wikidata</a>` : ""}</td>
      </tr>`;
    }).join("") || `<tr><td colspan="8">${t("no_sites")}</td></tr>`;
  }

  // ---- Records table -------------------------------------------------------------
  function renderRecords(fi) {
    document.querySelector("#records tbody").innerHTML = fi.map(i => {
      const cites = (D.citations[i.public_incident_id] || [])
        .map(c => `<a href="${c.url}" target="_blank" rel="noopener">${c.organization}</a>`)
        .filter((v, k, arr) => arr.indexOf(v) === k).join(", ");
      const mech = mechanismsOf(i.public_incident_id).map(mechLabel).join(", ");
      return `<tr>
        <td>${i.public_incident_id}</td>
        <td>${fmtDate(i)}</td>
        <td>${provinceName(i.province_code)}</td>
        <td lang="tr">${i.canonical_title_tr}</td>
        <td class="num">${fmt.format(i.fatalities_current)}${i.casualty_status === "disputed" ? `<br><span class="pill pill-dispute">${t("pill_disputed")}</span>` : ""}${i.injuries_current != null ? `<br><span class="pill">${tf("pill_injured", { n: fmt.format(i.injuries_current) })}</span>` : ""}</td>
        <td>${mech ? `<span class="pill">${mech}</span>` : `<span class="pill">${t("pill_no_mech")}</span>`}</td>
        <td>${cites}</td>
      </tr>`;
    }).join("") || `<tr><td colspan="7">${t("no_records")}</td></tr>`;
  }

  // ---- Downloads (filter-aware, built from the same payload) -----------------
  function toCsv(rows, columns) {
    const esc = v => {
      const s = v == null ? "" : String(v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    return [columns.join(",")]
      .concat(rows.map(r => columns.map(c => esc(r[c])).join(",")))
      .join("\n") + "\n";
  }
  function download(name, text, type) {
    const blob = new Blob([text], { type });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  const stamp = () => (D.export_timestamp || "").slice(0, 10) || "export";
  document.getElementById("dl-records").addEventListener("click", () => {
    const rows = incidents.filter(incidentMatches).map(i => ({
      public_incident_id: i.public_incident_id,
      date: (i.incident_start_datetime || "").slice(0, 10),
      date_display: fmtDate(i),
      date_precision: i.date_precision,
      province: provinceName(i.province_code),
      title_tr: i.canonical_title_tr,
      deaths: i.fatalities_current,
      casualty_status: i.casualty_status,
      injuries: i.injuries_current,
      mechanisms: mechanismsOf(i.public_incident_id).map(mechLabel).join("; "),
      latitude: i.latitude, longitude: i.longitude,
      coordinate_precision: i.coordinate_precision,
      sources: (D.citations[i.public_incident_id] || []).map(c => c.url)
        .filter((v, k, arr) => arr.indexOf(v) === k).join("; "),
    }));
    download(`mining-accident-records-${stamp()}.csv`, toCsv(rows, Object.keys(rows[0] || { public_incident_id: 1 })), "text/csv;charset=utf-8");
  });
  document.getElementById("dl-sites").addEventListener("click", () => {
    const rows = sites.filter(siteMatches).map(st => ({
      site: st.name,
      type: typeLabel(st),
      commodity: st.commodity_label || st.commodity_code,
      commodity_group: groupOf(st),
      province: st.province_name || provinceName(st.province_code),
      operators: (st.organizations || []).map(o => `${o.name} (${o.role})`).join("; "),
      operator_countries: (st.organizations || []).map(o => o.country_label).filter(Boolean).join("; "),
      status: statusLabel(st),
      latitude: st.latitude, longitude: st.longitude,
      coordinate_precision: st.coordinate_precision,
      source_url: st.source_url,
    }));
    download(`mining-sites-${stamp()}.csv`, toCsv(rows, Object.keys(rows[0] || { site: 1 })), "text/csv;charset=utf-8");
  });
  document.getElementById("dl-json").addEventListener("click", () => {
    const payload = {
      note: t("dl_note"),
      export_timestamp: D.export_timestamp,
      schema_version: D.schema_version,
      incidents: incidents, sites: sites, citations: D.citations,
      classifications: D.classifications, aggregates: D.aggregates,
      coverage_gap: D.coverage_gap, rate_context: D.rate_context,
    };
    download(`mining-accidents-${stamp()}.json`, JSON.stringify(payload, null, 2), "application/json");
  });

  // ---- Footer ----------------------------------------------------------------------
  function renderFooter() {
    document.getElementById("foot").innerHTML =
      tf("foot1", {
        ts: D.export_timestamp, v: D.schema_version,
        rev: fmt.format(D.pipeline.records_in_review || 0),
        wd: fmt.format(D.pipeline.withdrawn_records || 0),
        docs: fmt.format(D.pipeline.source_documents),
        claims: fmt.format(D.pipeline.claims_total),
        dec: fmt.format(D.pipeline.decisions_total),
      }) + "<br>" + t("foot2");
  }

  // ---- boot / re-render -------------------------------------------------------
  function renderAll() {
    applyStatic();
    renderOnThisDay();
    buildStory();
    renderTiles();
    fillSelects();
    renderChart();
    renderRates();
    renderMechanisms();
    renderFooter();
    applyFilters();
  }
  renderAll();
})();
</script>
